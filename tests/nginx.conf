# Disposable test proxy only. Not an audited production nginx template.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    client_max_body_size 2m;
    location / { try_files $uri /index.php$is_args$args; }
    location = /qa-runtime.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /tmp/qa-runtime.php;
        fastcgi_pass app:9000;
    }
    location ~ ^/(app|vendor|var|bin|translations|node_modules)/ { deny all; }
    location ~ /\. { deny all; }
    location ~ \.php(/|$) {
        include /etc/nginx/fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass app:9000;
    }
}
