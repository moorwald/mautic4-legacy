name: Verify images and manually publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified amd64 pair to GHCR (tracked release checks must be complete)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: mautic4-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify compatibility
    if: github.event_name != 'workflow_dispatch' || !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: ./.github/actions/verify
      - name: Upload bounded verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          retention-days: 14
          path: |
            artifacts/build-*.json
            artifacts/m4qa-*/report.json
            artifacts/composer-audit*.json
            artifacts/security-assessment.json
            artifacts/image-review.json

  publish:
    name: Manually publish tested images
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the reviewed release boundary before building
        run: python3 tools/check_release.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: ./.github/actions/verify
      - name: Assemble verified corresponding sources and licence handoff
        run: python3 tools/source_handoff.py
      - name: Authenticate to GHCR with this repository's ephemeral workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the exact tested image IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/publish.sh
      - name: Upload bounded verification and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          retention-days: 30
          path: |
            artifacts/build-*.json
            artifacts/m4qa-*/report.json
            artifacts/composer-audit*.json
            artifacts/security-assessment.json
            artifacts/published-*-manifest.json
            artifacts/image-review.json
            artifacts/source-handoff/source-manifest.json
            artifacts/source-handoff/SHA256SUMS
