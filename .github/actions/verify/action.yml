name: Verify the local image pair
description: Build, synthetic compatibility tests, inherited advisory report and upstream payload proof
runs:
  using: composite
  steps:
    - name: Build both amd64 variants
      shell: bash
      run: bash tools/build.sh
    - name: Run the four-case isolated compatibility matrix
      shell: bash
      run: python3 tests/integration.py
    - name: Review the bounded container/runtime delta
      shell: bash
      run: python3 tools/review_image.py
    - name: Report inherited application advisories without hiding tool errors
      shell: bash
      run: |
        set +e
        python3 tools/audit_installed.py
        status=$?
        set -e
        test "$status" -eq 0 -o "$status" -eq 1
        python3 - <<'PY'
        import json
        from pathlib import Path
        summary = json.loads(Path("artifacts/composer-audit-summary.json").read_text())
        assert summary["packages_audited"] > 0
        assert summary["composer_exit_code"] in (0, 1, 2, 3)
        print("Inherited findings remain disclosed, not a zero-advisory gate.")
        PY
    - name: Download the pinned public upstream archive
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p .cache/upstream
        gh release download 4.4.13 --repo mautic/mautic --pattern 4.4.13.zip --dir .cache/upstream
    - name: Verify byte-identical application payload and assess advisory metadata
      shell: bash
      run: python3 tools/assess_payload.py --upstream-zip .cache/upstream/4.4.13.zip
